    lines.forEach(function (l, i) { ox.fillText(l, cx, y0 + i * lh); });
    var d = ox.getImageData(0, 0, W, H).data, pts = [];
    for (var y = 0; y < H; y += step) for (var x = 0; x < W; x += step) {
      if (d[(y * W + x) * 4 + 3] > 128) pts.push([x + (Math.random() - .5) * step * .6, y + (Math.random() - .5) * step * .6, 0]);
    }
    return pts;
  }

  function setTargets(pts) {
    shuffle(pts);
    var now = performance.now();
    for (var i = 0; i < N; i++) {
      var p = P[i], t = pts[i];
      p.wait = now + Math.random() * 800;
      if (t) { p.nx = t[0]; p.ny = t[1]; p.na = 1; p.ng = t[2]; }
      else { p.nx = Math.random() * W; p.ny = Math.random() * H; p.na = 0; p.ng = 0; }
    }
  }

  function heartPts() {
    var cx = W / 2, cy = H * 0.46, sc = Math.min(W * 0.9 / 34, H * 0.5 / 30), pts = [];
    var n = Math.round(N * 0.78);
    for (var i = 0; i < n; i++) {
      var t = Math.random() * Math.PI * 2;
      var X = 16 * Math.pow(Math.sin(t), 3);
      var Y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      var r = 1 - Math.pow(Math.random(), 3) * 0.11;
      pts.push([cx + X * r * sc, cy + (-Y - 2.5) * r * sc, 0]);
    }
    var tp = sample(['I love you,', 'Vicusea ❤️'], sc * 19, sc * 8, cx, cy - sc * 1.2, 2);
    shuffle(tp).slice(0, N - n).forEach(function (q) { q[2] = 1; pts.push(q); });
    return pts;
  }

  function phases() {
    var portrait = H > W, cx = W / 2, cy = H / 2;
    var white = [225, 238, 255], pink = [255, 160, 205], hot = [255, 105, 170];
    var big = function (s) { return function () { return sample([s], W * 0.7, H * 0.55, cx, cy, 3); }; };
    return [
      { d: 3500, c: white, f: function () { return []; } },
      { d: 3400, c: white, f: big('3') },
      { d: 3400, c: white, f: big('2') },
      { d: 3400, c: white, f: big('1') },
      { d: 4600, c: white, f: function () { return sample(portrait ? ['I love', 'you'] : ['I love you'], W * 0.88, H * 0.6, cx, cy, 3); } },
      { d: 4800, c: pink, f: function () { return sample(portrait ? ['Vicusea', '❤️'] : ['Vicusea ❤️'], W * 0.88, H * 0.6, cx, cy, 3); } },
      { d: 0, c: hot, heart: true, f: heartPts }
    ];
  }

  function run(i) {
    var ph = phases()[i];
    seqIndex = i; heartMode = !!ph.heart;
    colT = ph.c;
    rainC.classList.toggle('dim', !!ph.heart);
    applyCur = function () { setTargets(ph.f()); };
    applyCur();
    if (ph.d) timers.push(setTimeout(function () { run(i + 1); }, ph.d));
    else timers.push(setTimeout(function () { hint.classList.add('show'); }, 5000));
  }

  function restart() {
    timers.forEach(clearTimeout); timers = [];
    hint.classList.remove('show');
    run(0);
  }

  var lastRain = 0;
  function rainTick() {
    rctx.fillStyle = 'rgba(0,0,0,.1)'; rctx.fillRect(0, 0, W, H);
    rctx.font = fs + 'px monospace'; rctx.fillStyle = 'rgba(195,220,255,.9)';
    for (var i = 0; i < drops.length; i++) {
      var y = drops[i] * fs;
      if (y > 0) rctx.fillText(CH.charAt(Math.random() * CH.length | 0), i * fs, y);
      if (y > H && Math.random() > 0.985) drops[i] = Math.random() * -20; else drops[i] += 1;
    }
  }

  var last = performance.now();
  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05); last = now;
    if (now - lastRain > 110) { lastRain = now; rainTick(); }
    var k = 1 - Math.exp(-dt * 2.2), ka = 1 - Math.exp(-dt * 2.5), kc = 1 - Math.exp(-dt * 1.2);
    for (var c = 0; c < 3; c++) col[c] += (colT[c] - col[c]) * kc;
    var s = heartMode ? 1 + 0.025 * Math.sin(now / 1000 * 1.6) : 1, cx = W / 2, cy = H * 0.46;
    fctx.clearRect(0, 0, W, H);
    var t = now / 1000;
    for (var g = 0; g < 2; g++) {
      fctx.fillStyle = g ? 'rgb(255,255,255)' : 'rgb(' + (col[0] | 0) + ',' + (col[1] | 0) + ',' + (col[2] | 0) + ')';
      for (var i = 0; i < N; i++) {
        var p = P[i];
        if (p.wait && now >= p.wait) { p.tx = p.nx; p.ty = p.ny; p.ta = p.na; p.g = p.ng; p.wait = 0; }
        if (p.g !== g) continue;
        p.x += (p.tx - p.x) * k; p.y += (p.ty - p.y) * k; p.a += (p.ta - p.a) * ka;
        if (p.a < 0.02) continue;
        var jx = Math.sin(t * 1.7 + p.ph) * 0.8, jy = Math.cos(t * 1.3 + p.ph) * 0.8;
        fctx.globalAlpha = p.a * (0.7 + 0.3 * Math.sin(t * 2.2 + p.ph * 3));
        fctx.fillRect(cx + (p.x - cx) * s + jx, cy + (p.y - cy) * s + jy, PS, PS);
      }
    }
    fctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  var rt;
  addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () { resize(); if (applyCur) applyCur(); }, 200);
  });
  var started = false, snd = document.getElementById('snd'), startEl = document.getElementById('start');
  function play() { try { snd.currentTime = 0; var r = snd.play(); if (r && r.catch) r.catch(function () {}); } catch (e) {} }
  document.addEventListener('pointerdown', function () {
    if (!started) { started = true; startEl.classList.add('gone'); play(); restart(); }
    else if (seqIndex === 6) { play(); restart(); }
  });

  resize(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
